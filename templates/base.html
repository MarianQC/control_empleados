<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresa XYZ - Control de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        html, body {
            background: linear-gradient(135deg, #0a1628 0%, #0f2847 50%, #0a1628 100%);
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: #e8edf3;
        }

        /* ── Navbar ── */
        .navbar-custom {
            background: rgba(10, 21, 32, 0.95);
            border-bottom: 1px solid rgba(45, 125, 210, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .navbar-custom .btn-salir {
            border: 1px solid rgba(45, 125, 210, 0.4);
            color: #7f93a8;
            font-size: 0.8rem;
            border-radius: 7px;
            padding: 0.3rem 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s;
        }
        .navbar-custom .btn-salir:hover {
            background: rgba(45, 125, 210, 0.15);
            border-color: #2d7dd2;
            color: #e8edf3;
        }

        /* ── Barra animada degradada bajo el navbar ── */
        .barra-nav {
            height: 3px;
            background: linear-gradient(90deg, #1d9e75, #2d7dd2, #7c3aed, #2d7dd2, #1d9e75);
            background-size: 200% 100%;
            animation: mover-gradiente 4s linear infinite;
        }
        @keyframes mover-gradiente {
            0%   { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* ── Footer ── */
        footer {
            background: rgba(10, 21, 32, 0.9) !important;
            border-top: 1px solid rgba(45, 125, 210, 0.15);
            color: #4d6070 !important;
            font-size: 0.8rem;
        }
        footer small { color: #4d6070; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-custom px-3">
        <div class="container-fluid">

            <!-- Logo (izquierda) -->
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="/static/logo.png" alt="Logo Empresa XYZ"
                     style="height: 60px; width: auto; max-width: 150px; object-fit: contain;">
            </a>

            <!-- Derecha: usuario + logout -->
            <div class="d-flex align-items-center gap-3">
                <span class="d-flex align-items-center gap-2" style="color:#e8edf3;">
                    <i class="bi bi-person-circle" style="font-size:1.3rem; color:#2d7dd2;"></i>
                    <span class="fw-semibold" style="font-size:0.9rem;">{% block usuario %}{% endblock %}</span>
                </span>
                <a href="/logout" class="btn-salir">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </a>
            </div>

        </div>
    </nav>
    <!-- Barra degradada animada -->
    <div class="barra-nav"></div>

    <!-- CONTENIDO -->
    <main class="flex-grow-1 py-4">
        <div class="container">
            {% block contenido %}
            {% endblock %}
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-3 mt-auto">
        <div class="container-fluid px-3">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start">
                    <small><i class="bi bi-building me-1"></i>Empresa XYZ &copy; 2026 — Todos los derechos reservados</small>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <small><i class="bi bi-geo-alt me-1"></i>Guayaquil, Ecuador</small>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
